[package]
name         = "texas-app"
license      = { workspace = true }
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }

[dependencies]
alacritty_terminal = { workspace = true }
anyhow             = { workspace = true }
backtrace          = { workspace = true }
chrono             = { workspace = true }
clap               = { workspace = true }
# Not imported directly: this pins the `monospace_fallback` feature for the
# cosmic-text build shared with floem (CJK glyph fallback in editors).
cosmic-text        = { workspace = true }
crossbeam-channel  = { workspace = true }
globset            = { workspace = true }
im                 = { workspace = true }
include_dir        = { workspace = true }
indexmap           = { workspace = true }
interprocess       = { workspace = true }
itertools          = { workspace = true }
texas-core         = { workspace = true }
texas-proxy        = { workspace = true }
texas-rpc          = { workspace = true }
lapce-xi-rope      = { workspace = true }
notify             = { workspace = true }
once_cell          = { workspace = true }
parking_lot        = { workspace = true }
rayon              = { workspace = true }
smallvec           = { workspace = true }
strum              = { workspace = true }
strum_macros       = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
sys-locale         = { workspace = true }
regex              = { workspace = true }
tar                = { workspace = true }
tempfile           = { workspace = true }
thiserror          = { workspace = true }
toml               = { workspace = true }
toml_edit          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
url                = { workspace = true }
zstd               = { workspace = true }
floem              = { workspace = true }

Inflector        = { version = "0.11.4" }
open             = { version = "5.1.4" }
unicode-width    = { version = "0.1.13" }
nucleo           = { version = "0.5.0" }
config           = { version = "=0.13.4", default-features = false, features = ["toml"] }
structdesc       = { git = "https://github.com/lapce/structdesc", rev = "bb56969f22fdb2c2d6c03f158fd4a2bdc983b659" }
sha2             = { version = "0.10.8" }
zip              = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features  = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default        = ["updater", "vendored-fonts"]
portable       = ["texas-core/portable"]
updater        = []
vendored-fonts = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name    = "visual_line"
harness = false
