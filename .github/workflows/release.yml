name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the Windows release"
        required: true
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep this aligned with GRAMMAR_RELEASE_TAG in texas-app/src/app/grammars.rs.
  GRAMMAR_RELEASE_TAG: v0.4.5+1f9f9dd

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Update Rust
        run: rustup update --no-self-update

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --frozen --profile release-lto --bin texas

      - name: Create portable archive
        shell: pwsh
        run: |
          cargo build --frozen --profile release-lto --features texas-app/portable --bin texas
          $packageRoot = Join-Path $env:RUNNER_TEMP "texas-portable"
          $assetsRoot = Join-Path $env:RUNNER_TEMP "texas-grammar-assets"
          $grammars = Join-Path $packageRoot "texas-data/data/grammars"
          $queries = Join-Path $packageRoot "texas-data/config/queries"
          New-Item -ItemType Directory -Path $packageRoot, $assetsRoot, $grammars, $queries | Out-Null
          Copy-Item ./target/release-lto/texas.exe $packageRoot
          gh release download $env:GRAMMAR_RELEASE_TAG `
            --repo lapce/tree-sitter-grammars `
            --pattern grammars-windows-x86_64.tar.zst `
            --pattern queries.tar.zst `
            --dir $assetsRoot
          tar -xf (Join-Path $assetsRoot "grammars-windows-x86_64.tar.zst") -C $grammars
          tar -xf (Join-Path $assetsRoot "queries.tar.zst") -C $queries
          [System.IO.File]::WriteAllText((Join-Path $grammars "version"), $env:GRAMMAR_RELEASE_TAG)
          [System.IO.File]::WriteAllText((Join-Path $queries "version"), $env:GRAMMAR_RELEASE_TAG)
          if (!(Test-Path (Join-Path $grammars "libtree-sitter-rust.dll"))) {
            throw "Rust grammar is missing from the portable package"
          }
          if (!(Test-Path (Join-Path $queries "rust/highlights.scm"))) {
            throw "Rust highlight query is missing from the portable package"
          }
          Compress-Archive (Join-Path $packageRoot "*") ./Texas-windows-portable.zip

      - name: Publish release
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG_NAME" \
            --title "$RELEASE_TAG_NAME" \
            --target "$GITHUB_SHA" \
            "${release_flags[@]}" \
            Texas-windows-portable.zip
