[package]
name         = "texas"
version      = { workspace = true }
description  = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
default-run  = "texas"

[dependencies]
texas-app = { path = "./texas-app" }

[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25.1", default-features = false, features = ["ico", "png"] }
resvg = "0.45.1"
tiny-skia = "0.11"
winres = "0.1.12"

[[bin]]
name = "texas"
path = "texas-app/src/bin/texas.rs"

[workspace]
members = ["texas-app", "texas-proxy", "texas-rpc", "texas-core"]

[workspace.package]
 version      = "0.1.3-rc.1"
description  = "A lightweight code editor with Git integration, a built-in terminal, and English and Simplified Chinese UI support."
edition      = "2024"
rust-version = "1.87.0"
license      = "Apache-2.0"
homepage     = "https://github.com/kevynf/texas"
repository   = "https://github.com/kevynf/texas"

[workspace.dependencies]
anyhow            = { version = "1.0" }
backtrace         = { version = "0.3" }
chrono            = { version = "0.4" }
clap              = { version = "4.5.0", default-features = false, features = ["std", "help", "usage", "derive"] }
# Keep CJK glyph fallback in code editors on a monospace face when possible.
cosmic-text       = { version = "0.14.2", features = ["monospace_fallback"] }
crossbeam-channel = { version = "0.5.12" }
directories       = { version = "4.0.1" }
dunce             = { version = "1.0.5" }
git2              = { version = "0.20.0", features = ["vendored-openssl"] }
globset           = { version = "0.4.14" }
im                = { version = "15.0.0", features = ["serde"] }
include_dir       = { version = "0.7" }
indexmap          = { version = "2.0", features = ["serde"] }
interprocess      = { version = "1.2.1" }
itertools         = { version = "0.12.1" }
notify            = { version = "5.2.0", features = ["serde"] }
once_cell         = { version = "1.19" }
parking_lot       = { version = "0.12.3" }
rayon             = { version = "1.10.0" }
regex             = { version = "1.10.5" }
remain            = { version = "0.2" }
reqwest           = { version = "0.11", features = ["blocking", "json", "socks"] }
serde             = { version = "1.0" }
serde_json        = { version = "1.0" }
smallvec          = { version = "1.15.1" }
sys-locale        = { version = "0.3.1" }
strum             = { version = "0.27.1" }
strum_macros      = { version = "0.27.1" }
tar               = { version = "0.4" }
tempfile          = { version = "3.10.1" }
thiserror         = { version = "1.0" }
toml              = { version = "*" }
toml_edit         = { version = "0.20.2", features = ["serde"] }
url               = { version = "2.5.0" }
zstd              = { version = "0.11.2" }

lapce-xi-rope = { version = "0.3.2", features = ["serde"] }

texas-core  = { path = "./texas-core" }
texas-rpc   = { path = "./texas-rpc" }
texas-proxy = { path = "./texas-proxy" }

floem = { git = "https://github.com/texas-projekt/texas-floem", rev = "67198cb4c97df0fd42137ec0497548e710bbeae4", features = ["editor", "serde", "default-image-formats", "rfd-async-std"] }
# floem = { path = "../floem", features = ["editor", "serde", "default-image-formats", "rfd-async-std"] }
floem-editor-core = { git = "https://github.com/texas-projekt/texas-floem", rev = "67198cb4c97df0fd42137ec0497548e710bbeae4", features = ["serde"] }
# floem-editor-core = { path = "../floem/editor-core/", features = ["serde"] }

[patch.crates-io]
# cargo vendor issue: https://github.com/rust-lang/cargo/issues/10310
# dpi comes from winit (source) and muda (crate)
dpi = { git = "https://github.com/rust-windowing/winit", rev = "ee245c569d65fdeacf705ee5eedb564508d10ebe" }


[workspace.dependencies.tracing]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing"

[workspace.dependencies.tracing-subscriber]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-subscriber"

[workspace.dependencies.tracing-appender]
git     = "https://github.com/tokio-rs/tracing"
rev     = "908cc432a5994f6e17c8f36e13c217dc40085704"
package = "tracing-appender"

[workspace.dependencies.alacritty_terminal]
git = "https://github.com/alacritty/alacritty"
rev = "cacdb5bb3b72bad2c729227537979d95af75978f"

[workspace.dependencies.windows-sys]
version  = "0.45.0"
features = ["Win32_Foundation"]

[profile.release-lto]
inherits      = "release"
lto           = true
codegen-units = 1

# A profile which compiles all (non-workspace) dependencies in release mode
# but Texas code in dev mode. This gives a good debugging experience for your
# code and fast performance of other people's code. After the initial
# build subsequent ones are as fast as dev mode builds.
# See https://doc.rust-lang.org/cargo/reference/profiles.html
# To use this profile:
#   cargo build --profile fastdev
#   cargo run --profile fastdev --bin texas
[profile.fastdev.package."*"]
opt-level = 3

[profile.fastdev]
inherits = "dev"
